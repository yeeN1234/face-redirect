<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>員工人臉建檔系統</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f23;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      text-align: center;
      max-width: 360px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 12px; }
    p { font-size: 0.875rem; color: #94a3b8; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
    }
    .status { font-size: 0.75rem; color: #64748b; margin-top: 16px; }
    .offline {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
    }
  </style>

  <!--
    ============================================
    在這裡更新 Tunnel 網址，改這一行就好：
    ============================================
  -->
  <script>
    var REDIRECT_URL = "https://trust-muscle-lace-employees.trycloudflare.com";
  </script>

  <script>
    // 如果有設定網址，3 秒後自動跳轉
    window.onload = function() {
      if (REDIRECT_URL && REDIRECT_URL !== "PASTE_YOUR_TUNNEL_URL_HERE") {
        document.getElementById("link").href = REDIRECT_URL;
        document.getElementById("link").style.display = "inline-block";
        document.getElementById("offline").style.display = "none";

        var countdown = 3;
        var timer = setInterval(function() {
          countdown--;
          document.getElementById("countdown").textContent = countdown;
          if (countdown <= 0) {
            clearInterval(timer);
            window.location.href = REDIRECT_URL;
          }
        }, 1000);
      } else {
        document.getElementById("link").style.display = "none";
        document.getElementById("offline").style.display = "block";
        document.getElementById("auto-redirect").style.display = "none";
      }
    };
  </script>
</head>
<body>
  <div class="card">
    <div style="font-size: 3rem; margin-bottom: 16px;">📸</div>
    <h1>員工人臉建檔系統</h1>
    <p>Face Enrollment System</p>

    <a id="link" class="btn" href="#">進入系統</a>

    <div id="offline" class="offline" style="display: none;">
      系統目前離線，請聯繫 IT 人員
    </div>

    <p id="auto-redirect" class="status"><span id="countdown">3</span> 秒後自動跳轉...</p>
  </div>
</body>
</html>
